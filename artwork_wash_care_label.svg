    <text x="170" y="24" class="sans" font-size="9" font-weight="700" letter-spacing="2" fill="#8C6527" text-anchor="middle">STITCH INTO INNER SEAM</text>

    <text x="170" y="82" class="serif" font-size="28" font-weight="600" letter-spacing="6" fill="#C5A059" text-anchor="middle">SHAPES</text>
    <text x="170" y="104" class="sans" font-size="9" font-weight="700" letter-spacing="3" fill="#C5A059" text-anchor="middle">BY SATIINDER KAUR</text>
    <text x="170" y="132" class="sans" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2B2117" text-anchor="middle">PREMIUM LUXURY APPAREL</text>
    <line x1="30" y1="145" x2="310" y2="145" stroke="#D8CABE" stroke-width="1" />

    <g transform="translate(50, 165)">
      <g transform="translate(20, 20)">
