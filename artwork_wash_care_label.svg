        <path d="M -8 -8 L -4 -2 L 0 -8 L 4 -2 L 8 -8" stroke="#C5A059" stroke-width="1.8" fill="none" />
        <text x="0" y="26" class="sans" font-size="7.5" font-weight="600" fill="#5A4A38" text-anchor="middle">Gentle Cold Wash</text>
      </g>

      <g transform="translate(120, 20)">
