      <text x="0" y="120" font-weight="700" fill="#C5A059">CLIENT CONCIERGE:</text>
      <text x="0" y="142">WhatsApp: +91 98333 92756</text>
      <text x="0" y="162">Email: shapesuniform@gmail.com</text>
      <text x="0" y="182">Web: shapesbysatiinderkaur.com</text>
    </g>

    <g transform="translate(170, 510)" class="sans" text-anchor="middle">
      <text x="0" y="0" font-size="7.5" font-weight="600" fill="#5A4A38">SHAPES, SHOP NO 4, Waman Apartments, Ghatla Village Rd,</text>
      <text x="0" y="14" font-size="7.5" font-weight="600" fill="#5A4A38">near MAITRI PARK, Basant Garden, Chembur, Mumbai, Maharashtra 400071</text>
      <text x="0" y="30" font-size="8" fill="#8C6527">© 2026 Shapes By Satiinder Kaur</text>
