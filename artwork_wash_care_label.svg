<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans { font-family: 'Montserrat', Arial, sans-serif; }
