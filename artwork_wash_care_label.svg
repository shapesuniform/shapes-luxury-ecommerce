        <circle cx="0" cy="0" r="8" fill="none" stroke="#C5A059" stroke-width="1.8" />
        <line x1="-12" y1="-12" x2="12" y2="12" stroke="#D32F2F" stroke-width="2" />
        <text x="0" y="26" class="sans" font-size="7.5" font-weight="600" fill="#5A4A38" text-anchor="middle">Do Not Tumble Dry</text>
      </g>
    </g>

    <g transform="translate(100, 245)">
      <g transform="translate(20, 20)">
        <path d="M -14 8 L 14 8 C 14 8 14 2 10 2 L -8 2 C -14 2 -14 8 -14 8 Z" fill="none" stroke="#C5A059" stroke-width="1.8" />
        <circle cx="0" cy="5" r="1.5" fill="#C5A059" />
        <text x="0" y="26" class="sans" font-size="7.5" font-weight="600" fill="#5A4A38" text-anchor="middle">Cool Iron Inside-Out</text>
      </g>

      <g transform="translate(120, 20)">
        <circle cx="0" cy="5" r="11" fill="none" stroke="#C5A059" stroke-width="1.8" />
        <text x="0" y="9" class="sans" font-size="10" font-weight="800" fill="#C5A059" text-anchor="middle">P</text>
        <text x="0" y="26" class="sans" font-size="7.5" font-weight="600" fill="#5A4A38" text-anchor="middle">Dry Clean Pref.</text>
      </g>
    </g>

    <g transform="translate(30, 345)" class="sans" font-size="9" fill="#2B2117">
      <text x="0" y="0" font-weight="700" fill="#C5A059">UNIVERSAL CARE GUIDELINES:</text>
      <text x="0" y="20">• Wash colors separately in mild liquid detergent.</text>
      <text x="0" y="38">• Do not wring or twist delicate handcrafted weaves.</text>
      <text x="0" y="56">• Dry flat in shade away from direct sunlight.</text>
      <text x="0" y="74">• Iron inside-out on low heat while slightly damp.</text>
      <text x="0" y="92">• Store in breathable cotton garment bag.</text>
    </g>

    <g transform="translate(170, 520)" class="sans" text-anchor="middle">
      <text x="0" y="0" font-size="9.5" font-weight="700" letter-spacing="1" fill="#C5A059">MADE WITH PRIDE IN INDIA</text>
      <text x="0" y="18" font-size="8.5" font-weight="600" fill="#5A4A38">100% ARTISANAL TAILORING</text>
