        <line x1="-10" y1="-8" x2="10" y2="8" stroke="#D32F2F" stroke-width="2" />
        <line x1="10" y1="-8" x2="-10" y2="8" stroke="#D32F2F" stroke-width="2" />
        <text x="0" y="26" class="sans" font-size="7.5" font-weight="600" fill="#5A4A38" text-anchor="middle">Do Not Bleach</text>
      </g>

      <g transform="translate(220, 20)">
