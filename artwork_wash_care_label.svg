  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#EAE2D5" />

  <text x="600" y="50" class="sans" font-size="14" font-weight="700" letter-spacing="4" fill="#8C6527" text-anchor="middle">UNIVERSAL WASH CARE &amp; FABRIC LONGEVITY TAG (CLEAN BORDERLESS)</text>
  <text x="600" y="75" class="sans" font-size="11" fill="#5A4A38" text-anchor="middle">SPEC: 40mm × 90mm · Warm Cream Soft Satin Ribbon · Plain Solid Gold Print · Clean Borderless</text>

  <!-- SIDE A -->
  <g transform="translate(200, 110)">
    <rect x="0" y="0" width="340" height="620" rx="10" fill="#FAF6EE" />
    
    <!-- Stitch Zone -->
